# Provider rate limits (SPEC §2). Enforced by ingest/ratelimit.py: [requests per second, burst].
rate_limits:
  adsb_lol: [1.0, 1]
  airplanes_live: [1.0, 1]
  adsb_fi: [1.0, 1]
  adsb_lol_history: [0.5, 1]     # globe_history release part downloads
  adsb_lol_history_probe: [4.0, 4]  # 512-byte tar header range reads (~50 per day)
  ourairports: [0.5, 1]          # two CSV downloads per `tw airfields update`
  vercel_blob: [2.0, 2]          # dashboard file uploads (a backfill is ~1,100 PUTs)
attribution:
  adsb_lol: "adsb.lol (ODbL)"
  airplanes_live: "airplanes.live"
  adsb_fi: "adsb.fi open data (https://adsb.fi)"
  ourairports: "OurAirports (public domain, https://ourairports.com/data/)"

# Coverage denominator (SPEC §5): count each aircraft at most once per this many seconds when
# building per-cell hourly coverage. Keeps a full global day tractable.
coverage_sample_seconds: 60

# adsb.lol globe_history releases (SPEC §2). A day's release lives in the repo for its year or,
# around New Year, the next year's repo. Tags: v<YYYY.MM.DD>-planes-readsb-<pod>-<suffix>.
# Assets are a plain tar split into parts: <tag>.tar.aa, <tag>.tar.ab, ...
# Only the prod pod is used: mixing pods could double-count aircraft and shift coverage.
history:
  base_url: "https://github.com"
  org: adsblol
  repo_prefix: globe_history_
  pods: [prod]
  tag_suffixes: ["0", "0tmp"]
  timeout_s: 60
  max_attempts: 3
  user_agent: "tanker-watch/0.1 (+https://github.com/thumplik/OSINT-tanker-tracker)"
  # Skip the ~800 MB ./heatmap prefix of each tar by walking tar headers with range requests.
  skip_heatmap: true
  max_header_probes: 200
  # Undecodable trace files are skipped and listed; more than this many fails the day.
  max_corrupt_traces: 50

# Airfield reference data (SPEC §5), pulled by `tw airfields update` into config/airfields.csv.
airfields:
  airports_url: "https://davidmegginson.github.io/ourairports-data/airports.csv"
  runways_url: "https://davidmegginson.github.io/ourairports-data/runways.csv"
  types: [large_airport, medium_airport, small_airport]
  min_runway_ft: 3000           # any surface: C-130s use dirt strips

# Live polling for the worker (SPEC §2, §4). Every request goes through ingest/ratelimit.py.
# Base URLs can be overridden in .env (`env` names the variable); the path is the military
# endpoint, which returns tracked aircraft worldwide in one request.
live:
  # Primary first; fail over down the list. airplanes.live answers 403 "please contact us" to
  # unregistered projects (checked 2026-10-27), so it stays out until the owner registers.
  order: [adsb_lol, adsb_fi]
  providers:
    adsb_lol:
      env: ADSBLOL_BASE_URL
      default_base_url: "https://api.adsb.lol"
      path: /v2/mil
    airplanes_live:
      env: AIRPLANESLIVE_BASE_URL
      default_base_url: "https://api.airplanes.live"
      path: /v2/mil
    adsb_fi:
      env: ADSBFI_BASE_URL
      default_base_url: "https://opendata.adsb.fi/api"
      path: /v2/mil
  poll_seconds: 15
  timeout_s: 20
  failover_after: 3             # consecutive failures before switching to the next provider
  failback_minutes: 15          # then try the primary again after this long
  backoff_base_s: 15            # wait after a failure doubles from this ...
  max_backoff_s: 300            # ... up to this (HTTP 429 always waits)
  raw_retention_days: 14        # SPEC §2: raw responses kept 14 days

# Dashboard hand-off (SPEC §4, M5): the exporter uploads static day files to Vercel Blob. The
# token is BLOB_READ_WRITE_TOKEN in .env, never logged. Request format follows @vercel/blob 2.8
# (checked 2026-10-28): PUT <api_url>/?pathname=..., option headers x-*.
blob:
  api_url: "https://vercel.com/api/blob"
  api_version: 13
  timeout_s: 60
