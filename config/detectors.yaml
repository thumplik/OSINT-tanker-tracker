# All detector thresholds (SPEC §7–8). No magic numbers in detector code.
baseline:
  window_days: 56
  min_history_days: 28          # keys with less history show "insufficient baseline"
  mad_scale: 1.4826
  mad_floor: 1.0                # used when MAD is 0 so sparse keys don't give infinite z

# Sortie segmentation and airfield resolution (SPEC §5).
sortie:
  max_gap_minutes: 30
  min_ground_seconds: 60        # shorter ground runs are touch-and-goes; the sortie continues
  # A longer gap is a coverage hole, not a landing, if all three hold:
  bridge_min_alt_ft: 10000      # aircraft at or above this on both sides of the gap
  bridge_max_gap_hours: 6
  bridge_max_speed_kt: 600      # great-circle distance / gap duration
  min_points: 5                 # shorter sorties are noise and are dropped (and counted)
  min_minutes: 5
  # 15 km / 4,000 ft chosen from a sweep on 7 days of Sept 2026 (handoff.md, SPEC §5): on a 3°
  # approach an aircraft 15 km out is ~2,600 ft up, and MLAT often loses it below that.
  airfield_radius_km: 15
  airfield_max_agl_ft: 4000
  # An end counts as "seen low" (resolvable) if the ground was seen or the first/last point is
  # below this height above the nearest field within the radius. The M2 target uses these.
  seen_low_agl_ft: 5000
  seen_low_field_radius_km: 30
  lookback_days: 1              # days before D read to find flights airborne at midnight

# Which sorties count toward D1 and D2 (owner decision, Oct 2026). A sortie counts once in each
# region it flies in (any of its H3 r4 cells). Shorter sorties (pattern work, fragments) don't count.
counting:
  min_sortie_minutes: 30

d1_volume_surge:
  window_hours: 24
  min_z: 3.0
  min_count: 6
  min_coverage_normalized_ratio: 1.5
  # (observed / max(median, this)) / coverage ratio: a median of 0 is treated as this, so a key
  # never seen before is compared with one sortie a day rather than divided by zero.
  normalization_median_floor: 1.0

d2_novel_destination:
  window_hours: 72
  max_baseline_arrivals: 1      # distinct aircraft of the family at the field in the baseline window
  min_arrivals: 2               # distinct aircraft in the window (owner decision: not sorties)

d3_unusual_orbit:
  min_heading_change_deg: 720
  max_radius_km: 40
  baseline_percentile: 95

d4_airlift_convergence:
  window_hours: 48
  min_distinct_hexes: 4
  min_z: 3.0

d5_route_shift:
  window_hours: 72
  min_share_change_points: 20

guards:
  coverage_min_ratio: 0.6       # suppress if regional traffic < 60% of its baseline
  coverage_max_ratio: 1.67      # ... or > 167% (1 / 0.6): receivers came online (owner, Oct 2026)
  cooldown_hours: 12

composite:
  merge_window_hours: 24
  medium_min_detectors: 2
  medium_min_z: 4.0
  high_min_detectors: 3
  post_queue_severities: [medium, high]
