# Tracked fleet (SPEC §3). Edit here, never in code.
military_hex_block:
  start: "ae0000"
  end: "afffff"

# A type code may belong to more than one family. C30J is tactical airlift only: the code covers
# both the C-130J-30 airlifter and the USMC KC-130J tanker, which ADS-B can't tell apart, and
# counting it twice doubled every alert (owner decision, Oct 2026).
families:
  tanker:
    types: [K35R, KC46, B762]
  strategic_airlift:
    types: [C17, C5M]
  tactical_airlift:
    types: [C130, C30J]
# B762: adsb.lol types the KC-46A as B762 (no KC46 seen in real dumps; owner-confirmed
# 2026-10-27). Only hexes in the military block count, so civil 767-200s are excluded.
# KC-10 (DC10) retired in 2024 and is intentionally not listed.

# ADSBx v2 `type` values (position source) treated as lower quality.
low_quality_sources: [mlat, mode_s, tisb_trackfile, other]
